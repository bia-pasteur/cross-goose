[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossgoose"
version = "1.3.5"
description = "Instance segmentation of crossing/overlapping objects using gradient flow-based methods"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Julie Mabon"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "edt",
    "fastremap",
    "imageio",
    "jsonargparse[signatures]>=4.27.7",
    "lightning",
    "matplotlib",
    "natsort",
    "numba",
    "numpy",
    "opencv-python",
    "pandas",
    "roifile",
    "scikit-image",
    "scipy",
    "tensorboard",
    "tifffile>=2025",
    "torch>=2.4",
    "torchvision",
    "fill-voids==2.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crossgoose*"]
